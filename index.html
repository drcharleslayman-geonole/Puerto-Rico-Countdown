<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dillon-Layman Puerto Rico Adventure 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
}

/* Video background container */
.video-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: -2;
}

.video-bg video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Soft dark overlay for readability */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.25);
    z-index: -1;
}

/* Floating content */
body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
}

.content {
    padding: 20px;
}

h1 {
    font-size: 2.6em;
    margin-bottom: 20px;
    text-shadow: 0 4px 12px rgba(0,0,0,0.7);
}

#countdown {
    font-size: 2.1em;
    text-shadow: 0 4px 12px rgba(0,0,0,0.7);
}

.time-box {
    display: inline-block;
    margin: 8px 18px;
}

.label {
    font-size: 0.75em;
    opacity: 0.85;
}
</style>
</head>

<body>

<!-- 🌊 Real ocean waves video -->
<div class="video-bg">
    <video autoplay muted loop playsinline>
        https://cdn.coverr.co/videos/coverr-waves-crashing-on-the-shore-7227/1080p.mp4
    </video>
</div>

<div class="overlay"></div>

<div class="content">
    <h1>Dillon‑Layman Puerto Rico Adventure 2026</h1>
    <div id="countdown"></div>
</div>

<script>
const targetDate = new Date("July 3, 2026 00:00:00").getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const diff = targetDate - now;

    if (diff <= 0) {
        document.getElementById("countdown").innerHTML =
            "✈️ It’s Adventure Time! 🌴";
        return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);

    document.getElementById("countdown").innerHTML = `
        <div class="time-box">${days}<div class="label">Days</div></div>
        <div class="time-box">${hours}<div class="label">Hours</div></div>
        <div class="time-box">${minutes}<div class="label">Minutes</div></div>
    `;
}

updateCountdown();
setInterval(updateCountdown, 60000);
</script>

</body>
</html>
