<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dillon-Layman Puerto Rico Adventure 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
}

body {
    background:
        linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
        url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e");
    background-size: cover;
    background-position: center;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

h1 {
    font-size: 2.5em;
    margin-bottom: 15px;
    text-shadow: 0 4px 12px rgba(0,0,0,0.7);
}

#countdown {
    font-size: 2em;
    margin-bottom: 25px;
    text-shadow: 0 4px 12px rgba(0,0,0,0.7);
}

.time-box {
    display: inline-block;
    margin: 8px 12px;
}

.label {
    font-size: 0.75em;
    opacity: 0.85;
}

/* Audio player styling */
audio {
    width: 260px;
    margin-top: 10px;
    opacity: 0.85;
}
</style>
</head>

<body>

<h1>Dillon‑Layman Puerto Rico Adventure 2026</h1>

<div id="countdown"></div>

<!-- ✅ Native audio controls (mobile-safe) -->
<audio controls loop playsinline>
    https://cdn.pixabay.com/download/audio/2021/09/20/audio_7c9fa1c7c1.mp3
    Your browser does not support audio.
</audio>

<script>
const targetDate = new Date("July 3, 2026 00:00:00").getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const diff = targetDate - now;

    if (diff <= 0) {
        document.getElementById("countdown").innerHTML = "✈️ It’s Adventure Time! 🌴";
        return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("countdown").innerHTML = `
        <div class="time-box">${days}<div class="label">Days</div></div>
        <div class="time-box">${hours}<div class="label">Hours</div></div>
        <div class="time-box">${minutes}<div class="label">Minutes</div></div>
        <div class="time-box">${seconds}<div class="label">Seconds</div></div>
    `;
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
