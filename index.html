<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dillon-Layman Puerto Rico Adventure 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* Full-screen tropical ocean background */
body {
    background:
        linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
        url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

/* Floating content */
.content {
    padding: 20px;
}

/* Title */
h1 {
    font-size: 2.6em;
    margin-bottom: 20px;
    text-shadow: 0 4px 12px rgba(0,0,0,0.7);
}

/* Countdown */
#countdown {
    font-size: 2.1em;
    text-shadow: 0 4px 12px rgba(0,0,0,0.7);
}

/* Time units */
.time-box {
    display: inline-block;
    margin: 8px 18px;
}

.label {
    font-size: 0.75em;
    opacity: 0.85;
}
</style>
</head>

<body>

<div class="content">
    <h1>Dillon‑Layman Puerto Rico Adventure 2026</h1>
    <div id="countdown"></div>
</div>

<script>
const targetDate = new Date("July 3, 2026 00:00:00").getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const diff = targetDate - now;

    if (diff <= 0) {
        document.getElementById("countdown").innerHTML =
            "✈️ It’s Adventure Time! 🌴";
        return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);

    document.getElementById("countdown").innerHTML = `
        <div class="time-box">${days}<div class="label">Days</div></div>
        <div class="time-box">${hours}<div class="label">Hours</div></div>
        <div class="time-box">${minutes}<div class="label">Minutes</div></div>
    `;
}

updateCountdown();
setInterval(updateCountdown, 60000); // update once per minute
</script>

</body>
</html>
